name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          python -c "
          import time, urllib.request
          start_time = time.time()
          for attempt in range(1, 61):
              for url in ['http://127.0.0.1:8000/health', 'http://localhost:8000/health']:
                  try:
                      res = urllib.request.urlopen(url, timeout=3)
                      if res.getcode() == 200:
                          print(f'Backend server healthy at {url} after {time.time() - start_time:.1f}s!')
                          exit(0)
                  except Exception:
                      pass
              if attempt % 5 == 0:
                  print(f'Waiting for backend startup (attempt {attempt}/60)...')
              time.sleep(1)

          print('Backend failed to start within 60s. Server log output:')
          try:
              with open('server.log') as f:
                  print(f.read())
          except Exception as e:
              print(f'Could not read server.log: {e}')
          exit(1)
          "

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: python -m pytest

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build